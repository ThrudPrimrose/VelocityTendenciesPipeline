cache: name
cache_distaware: true
call_hooks: ''
compiled_sdfg_call_hooks: ''
compiler:
  allow_shadowing: true
  allow_view_arguments: false
  build_folder_mode: development
  build_jobs: 4
  build_mode: cmake
  build_type: Release
  codegen_lineinfo: false
  codegen_state_struct_suffix: _state_t
  command_cache: true
  configure_cache: true
  cpp_standard: '20'
  cpu:
    args: -Wconversion -Wno-sign-conversion -Wfloat-conversion -Wno-unknown-pragmas
      -faligned-new -g -std=c++20 -Wall -Wextra -Wno-unused-parameter -Wno-unused-variable
      -O3 -DNDEBUG -fopenmp
    codegen_params:
      const_init: 'on'
      const_scalar_abi: by_ref
      decl_placement: eager
      external_translation_units: false
      heap_ptr_restrict: restrict
      index_ctype: int64
      index_fn_qualifier: inline_constexpr
      inline_full_array_nsdfg: false
      loop_access_form: indexed
      loop_bound_cmp: lt
      loop_decl_style: for_init
      loop_index_type: auto
      scalar_init_style: split
      split_nsdfg_translation_units: false
    executable: ''
    explicit_copy: true
    implementation: experimental_readable
    libs: ''
    openmp_sections: false
    parallel_min_work_per_region: 256
    parallel_transfer_min_elements: 262144
    simd_maps: true
  cuda:
    allow_implicit_memlet_to_map: true
    args: --diag-suppress 68 --diag-suppress 550 --diag-suppress 20208 --diag-suppress
      1835 --diag-suppress 177 --diag-suppress 20012 --diag-suppress 1098 -Xcompiler=-Wconversion
      -Xcompiler=-Wsign-conversion -Xcompiler=-Wfloat-conversion -Xcompiler=-Wno-unknown-pragmas
      -Xcompiler=-faligned-new -DNDEBUG -Xcompiler=-DNDEBUG -Xcompiler=-Wall -Xcompiler=-Wextra
      -Xcompiler=-O3 -Xcompiler=-fopenmp --expt-relaxed-constexpr -arch=sm_90a --use_fast_math
      -O3 -lineinfo --ftz=true --prec-div=false --prec-sqrt=false --fmad=true -Xptxas=-O3
      -Xptxas=-v -Xcompiler=-march=native -Xcompiler=-mtune=native --restrict -std=c++20
    auto_syncthreads_insertion: true
    backend: auto
    block_size_lastdim_limit: 64
    block_size_limit: 1024
    cuda_arch: ''
    cuda_warp_size: 32
    default_block_size: 32,16,1
    dynamic_map_block_size: 128,1,1
    dynamic_map_fine_grained: true
    gpu_index_type: int32
    gpu_stream_name: gpu_streams,gpu_stream
    hip_arch: ''
    hip_args: ''
    hip_warp_size: 64
    implementation: legacy
    libs: ''
    max_concurrent_streams: '-1'
    mempool_release_threshold: -1
    path: ''
    persistent_map_SM_fraction: 1.0
    persistent_map_occupancy: 2
    syncdebug: false
    synchronize_on_exit: true
    thread_id_type: int32
  default_data_types: Python
  emit_tree_reductions: false
  extra_cmake_args: ''
  format_code: false
  format_config_file: ''
  indentation_spaces: 4
  inline_sdfgs: false
  library_extension: so
  library_prefix: lib
  lineinfo: inspect
  linker:
    args: ''
    executable: ''
  max_stack_array_size: 65536
  mpi:
    executable: ''
  precompiled_header: true
  static_archive: false
  unique_functions: hash
  use_cache: false
debugprint: false
default_build_folder: .dacecache
experimental:
  check_race_conditions: false
  validate_undefs: false
external_transformations_path: $HOME/dace_transformations/external_transformations
frontend:
  avoid_wcr: false
  cache_size: 32
  check_args: false
  dont_fuse_callbacks: false
  implicit_recursion_depth: 64
  preprocessing_passes: 5
  raise_nested_parsing_errors: false
  typed_callbacks_only: false
  unroll_threshold: -1
  verbose_errors: false
graph:
  backend: networkx
instrumentation:
  papi:
    default_counters: '[''PAPI_TOT_INS'', ''PAPI_TOT_CYC'', ''PAPI_L2_TCM'', ''PAPI_L3_TCM'']'
    overhead_compensation: true
    vectorization_analysis: false
  report_each_invocation: true
library:
  blas:
    default_implementation: pure
    override: false
  lapack:
    default_implementation: OpenBLAS
    override: false
  linalg:
    default_implementation: OpenBLAS
    override: false
  pblas:
    default_implementation: MKLMPICH
    override: false
optimizer:
  automatic_simplification: true
  autooptimize: false
  autospecialize: false
  autotile_partial_parallelism: true
  autotile_size: 128
  canonicalization:
    peel_limit: 8
    unroll_limit: 8
  detect_control_flow: true
  gpu_taskloop_heuristics: false
  match_exception: false
  new_gpu_offloading_pass: true
  save_intermediate: false
  symbolic_positive: true
  visualize_sdfv: false
profiling: false
profiling_status: true
progress: true
store_history: true
testing:
  deserialize_exception: false
  serialization: false
  serialize_all_fields: false
treps: 100
